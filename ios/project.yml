name: Shreddish

options:
  bundleIdPrefix: app.shreddish
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  developmentLanguage: fr
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 9L3FSA2TXF
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    ALWAYS_SEARCH_USER_PATHS: NO
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES

packages:
  ShreddishCore:
    path: Packages/ShreddishCore

targets:
  # Apple Watch (spec 017, FR-1711) : app compagnon, données reçues de l'iPhone par WatchConnectivity.
  ShreddishWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
      - path: App/Resources/Localizable.xcstrings
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Shreddish
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr, en, es, de, it]
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.shreddish
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shreddish.watchkitapp
        PRODUCT_NAME: ShreddishWatch
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  Shreddish:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
      - path: Shared
    dependencies:
      - package: ShreddishCore
      - target: ShreddishWatch
    entitlements:
      path: App/Shreddish.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    # Clé API locale (Config/Secrets.example.xcconfig), copiée dans l'app au build (spec 009).
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Shreddish
        UIAppFonts:
          - BricolageGrotesque.ttf
          - DMSans.ttf
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr, en, es, de, it]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Scanner le code-barres d'un aliment pour l'ajouter au journal."
        NSHealthShareUsageDescription: "Lire ton poids et ta dépense active pour affiner tes cibles, si tu actives Apple Santé."
        NSHealthUpdateUsageDescription: "Enregistrer les apports de ton journal dans Apple Santé, si tu l'actives."
        # Vide sauf si Config/Secrets.xcconfig la définit (spec 009).
        ShreddishOpenAIKey: $(OPENAI_API_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shreddish
        PRODUCT_NAME: Shreddish
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin:$HOME/.local/bin"
          if command -v swiftlint >/dev/null 2>&1; then
            cd "${SRCROOT}" && swiftlint lint --config .swiftlint.yml --quiet
          else
            echo "warning: SwiftLint non installé"
          fi

  AppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: Shreddish
      - package: ShreddishCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shreddish.apptests
        PRODUCT_NAME: AppTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Shreddish.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Shreddish"
        BUNDLE_LOADER: "$(TEST_HOST)"

  UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Shreddish
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shreddish.uitests
        PRODUCT_NAME: UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Shreddish

schemes:
  Shreddish:
    build:
      targets:
        Shreddish: all
    run:
      config: Debug
      storeKitConfiguration: App/Resources/Shreddish.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - AppTests
    archive:
      config: Release

  Shreddish-UITests:
    build:
      targets:
        Shreddish: all
        UITests: [test]
    test:
      config: Debug
      targets:
        - UITests
